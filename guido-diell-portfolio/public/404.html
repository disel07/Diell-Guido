<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guido Diell | Redirecting</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#00f3ff" />
    <script>
      (function () {
        var base = '/Diell-Guido';
        var path = window.location.pathname;
        var redirect = path.indexOf(base) === 0 ? path.slice(base.length) : '/';
        redirect = redirect || '/';

        sessionStorage.setItem(
          'gh-pages-redirect',
          redirect + window.location.search + window.location.hash
        );
        window.location.replace(base + '/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Guido Diell Portfolio...</p>
  </body>
</html>
